# Deploy Server
#
# Promote flow: staging runs check + build and pushes a sha-tagged image to GHCR.
# main looks up ghcr.io/<repo>:sha-<short> for github.sha (and merge 2nd parent) —
# on hit, retag as latest and SSH deploy only; on miss, rebuild then deploy.

name: Deploy Server

on:
  push:
    branches: ['main', 'staging']
    paths:
      - 'server/**'
      - 'packages/shared-schemas/**'
      - 'turbo.json'
      - '.github/workflows/deploy-server.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'server/**'
      - 'packages/shared-schemas/**'
      - 'turbo.json'
      - '.github/workflows/deploy-server.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}

jobs:
  promote-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      is_main_deploy: ${{ steps.meta.outputs.is_main_deploy }}
      hit: ${{ steps.meta.outputs.hit }}
      image: ${{ steps.meta.outputs.image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Resolve promote metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IS_MAIN_DEPLOY=false
          HIT=false
          IMAGE="ghcr.io/${REPO}:sha-${SHORT_SHA}"

          if [ '${{ github.ref }}' = 'refs/heads/main' ] && \
             { [ '${{ github.event_name }}' = 'push' ] || [ '${{ github.event_name }}' = 'workflow_dispatch' ]; }; then
            IS_MAIN_DEPLOY=true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Prefer this commit; for merge commits also try 2nd parent (staging tip).
            CANDIDATES=("$GITHUB_SHA")
            while IFS= read -r parent; do
              [ -n "$parent" ] && CANDIDATES+=("$parent")
            done < <(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}" \
              --jq '.parents[1:][].sha // empty')

            for cand in "${CANDIDATES[@]}"; do
              CAND_SHORT="${cand:0:7}"
              CAND_IMAGE="ghcr.io/${REPO}:sha-${CAND_SHORT}"
              if docker manifest inspect "$CAND_IMAGE" >/dev/null 2>&1; then
                HIT=true
                SHORT_SHA="$CAND_SHORT"
                IMAGE="$CAND_IMAGE"
                echo "Promote hit: $CAND_IMAGE (from $cand)"
                break
              fi
              echo "No image at $CAND_IMAGE"
            done

            if [ "$HIT" != true ]; then
              echo "Promote miss — will rebuild."
            fi
          fi

          {
            echo "is_main_deploy=$IS_MAIN_DEPLOY"
            echo "hit=$HIT"
            echo "image=$IMAGE"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: promote-meta
    if: needs.promote-meta.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint, format, and typecheck
        run: pnpm run check:server

      - name: Build
        run: pnpm exec turbo run build --filter=server

      # Push sha-tagged image on staging (for later promote) and on main rebuild fallback.
      - name: Set up Docker Buildx
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (To prevent rate limits)
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stable scope so Chromium/apt layer + BuildKit caches reuse across pushes (not mixed with other workflows).
          cache-from: type=gha,scope=school-server
          cache-to: type=gha,mode=max,scope=school-server

  deploy:
    needs: [promote-meta, ci]
    if: |
      always() && !cancelled() &&
      needs.promote-meta.outputs.is_main_deploy == 'true' &&
      (needs.promote-meta.outputs.hit == 'true' || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PROJECT_PATH: 'School'
      ENV_FILE: '.env.lbp'
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote sha image to latest
        if: needs.promote-meta.outputs.hit == 'true'
        env:
          IMAGE_SHA: ${{ needs.promote-meta.outputs.image }}
        run: |
          set -euo pipefail
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_LATEST="ghcr.io/${REPO}:latest"
          docker pull "$IMAGE_SHA"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_LATEST"
          echo "Promoted $IMAGE_SHA → $IMAGE_LATEST"

      - name: Prepare server and pull image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e

            # Disk space and Docker cleanup (once for both deployments)
            echo "Checking disk space..."
            df -h
            # Prune stopped containers/dangling images/unused networks only —
            # keep tagged images so unchanged layers are reused on next pull.
            echo "Cleanup..."
            docker system prune -f

            # Login to GHCR (once for both deployments)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Get image name (lowercased repository)
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/$REPO:latest"

            echo "Pulling image: $IMAGE_NAME"
            docker pull $IMAGE_NAME

            # Tag for compose
            docker tag $IMAGE_NAME school_backend:latest

            # Cleanup old images
            docker image prune -f

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            # Set target directory relative to home
            mkdir -p ~/${{ env.PROJECT_PATH }}/server
            cd ~/${{ env.PROJECT_PATH }}/server
            git reset --hard HEAD
            CURRENT_BRANCH=$(git branch --show-current)
            git fetch origin "$CURRENT_BRANCH"
            git reset --hard "origin/$CURRENT_BRANCH"
            # Ensure scripts are executable
            chmod +x restart.sh setup-network.sh

            # Environment setup
            ENV_FILE="${{ env.ENV_FILE }}"
            PROJECT_NAME=$(basename "$ENV_FILE")
            PROJECT_NAME="${PROJECT_NAME#.env.}"

            # Export ENV_FILE for docker compose interpolation
            export ENV_FILE="$ENV_FILE"

            echo "Running database migrations..."
            docker compose -p "$PROJECT_NAME" --env-file "$ENV_FILE" -f backend-run.yml run --rm --entrypoint "" school_backend sh -c 'if [ -n "$MIGRATION_DATABASE_URL" ]; then DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec prisma migrate deploy; else pnpm exec prisma migrate deploy; fi'

            echo "Seeding database..."
            docker compose -p "$PROJECT_NAME" --env-file "$ENV_FILE" -f backend-run.yml run --rm --entrypoint "" school_backend sh -c 'if [ -n "$MIGRATION_DATABASE_URL" ]; then DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec prisma db seed; else pnpm exec prisma db seed; fi'

            # Final restart with orphans cleanup
            ./restart.sh $ENV_FILE --no-build --no-logs
