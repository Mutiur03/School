name: Deploy Server

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "packages/shared-schemas/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "packages/shared-schemas/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PROJECT_PATH: "School"
      ENV_FILE: ".env.lbp"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-schemas
        run: pnpm --filter @school/shared-schemas build

      - name: Lint
        run: pnpm --filter server lint

      - name: Type-check / build
        run: pnpm --filter server build

      # PRs stop here — no image push, no deploy.
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (To prevent rate limits)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        if: github.event_name != 'pull_request'
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            latest

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stable scope so Chromium/apt layer + BuildKit caches reuse across pushes (not mixed with other workflows).
          cache-from: type=gha,scope=school-server
          cache-to: type=gha,mode=max,scope=school-server

      - name: Prepare server and pull image
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e

            # Disk space and Docker cleanup (once for both deployments)
            echo "Checking disk space..."
            df -h
            # Prune stopped containers/dangling images/unused networks only —
            # keep tagged images so unchanged layers are reused on next pull.
            echo "Cleanup..."
            docker system prune -f

            # Login to GHCR (once for both deployments)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Get image name (lowercased repository)
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/$REPO:latest"

            echo "Pulling image: $IMAGE_NAME"
            docker pull $IMAGE_NAME

            # Tag for compose
            docker tag $IMAGE_NAME school_backend:latest

            # Cleanup old images
            docker image prune -f

      - name: Deploy via SSH
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            # Set target directory relative to home
            mkdir -p ~/${{ env.PROJECT_PATH }}/server
            cd ~/${{ env.PROJECT_PATH }}/server
            git reset --hard HEAD
            CURRENT_BRANCH=$(git branch --show-current)
            git fetch origin "$CURRENT_BRANCH"
            git reset --hard "origin/$CURRENT_BRANCH"
            # Ensure scripts are executable
            chmod +x restart.sh setup-network.sh

            # Environment setup
            ENV_FILE="${{ env.ENV_FILE }}"
            PROJECT_NAME=$(basename "$ENV_FILE")
            PROJECT_NAME="${PROJECT_NAME#.env.}"

            # Export ENV_FILE for docker compose interpolation
            export ENV_FILE="$ENV_FILE"

            echo "Running database migrations..."
            docker compose -p "$PROJECT_NAME" --env-file "$ENV_FILE" -f backend-run.yml run --rm --entrypoint "" school_backend sh -c 'if [ -n "$MIGRATION_DATABASE_URL" ]; then DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec prisma migrate deploy; else pnpm exec prisma migrate deploy; fi'

            echo "Seeding database..."
            docker compose -p "$PROJECT_NAME" --env-file "$ENV_FILE" -f backend-run.yml run --rm --entrypoint "" school_backend sh -c 'if [ -n "$MIGRATION_DATABASE_URL" ]; then DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm exec prisma db seed; else pnpm exec prisma db seed; fi'

            # Final restart with orphans cleanup
            ./restart.sh $ENV_FILE --no-build --no-logs
