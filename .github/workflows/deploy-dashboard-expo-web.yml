# Deploy dashboard-expo web (Cloudflare Pages)
#
# Same promote flow as deploy-pages.yml: staging builds dist/web and uploads it as an artifact.
# main looks up a successful staging run for github.sha (and merge 2nd parent): on hit, download
# the dist and wrangler deploy only; on miss, rebuild. Only main deploys.
#
# Static SPA, same-origin /api. The Pages custom domain must match a school-auth-bff route
# (*.lbphs.gov.bd/api/*), which proxies /api; the backend resolves the school from the host.
# No 404.html in the export, so Pages falls back to index.html for deep links.
#
# Five sites from one commit: the all-roles site (school-dashboard-expo, unchanged) and four
# role-locked sites, built with EXPO_PUBLIC_APP_ROLE (apps/dashboard-expo/src/navigation/
# deployment-lock.ts): every route outside that role is a 404 and other roles are signed out.
#   school-dashboard-expo-admin / -teacher / -student / -superadmin
# Native builds and OTAs (deploy-dashboard-expo*.yml) never set EXPO_PUBLIC_APP_ROLE.

name: Deploy dashboard-expo web

on:
  push:
    branches: [staging, main]
    paths:
      - 'apps/dashboard-expo/**'
      - 'packages/shared-schemas/**'
      - '.github/workflows/deploy-dashboard-expo-web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: dashboard-expo-web-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT: pages-school-dashboard-expo
  # The four role-locked exports, one folder each (admin, teacher, student, superadmin).
  ROLES_ARTIFACT: pages-school-dashboard-expo-roles

jobs:
  promote-meta:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      is_main_deploy: ${{ steps.meta.outputs.is_main_deploy }}
      hit: ${{ steps.meta.outputs.hit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - name: Resolve promote metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IS_MAIN_DEPLOY=false
          HIT=false
          RUN_ID=

          if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            IS_MAIN_DEPLOY=true

            CANDIDATES=("$GITHUB_SHA")
            while IFS= read -r parent; do
              [ -n "$parent" ] && CANDIDATES+=("$parent")
            done < <(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}" \
              --jq '.parents[1:][].sha // empty')

            for cand in "${CANDIDATES[@]}"; do
              CAND_RUN="$(gh run list \
                --repo '${{ github.repository }}' \
                --branch staging \
                --commit "$cand" \
                --workflow '${{ github.workflow }}' \
                --status success \
                --limit 20 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$cand\")][0].databaseId // empty")"
              [ -z "$CAND_RUN" ] && { echo "No staging run for $cand"; continue; }
              NAMES="$(gh api "repos/${{ github.repository }}/actions/runs/${CAND_RUN}/artifacts" \
                --jq '.artifacts[].name')"
              if grep -qx "$ARTIFACT" <<<"$NAMES" && grep -qx "$ROLES_ARTIFACT" <<<"$NAMES"; then
                HIT=true
                RUN_ID="$CAND_RUN"
                echo "Promote hit: staging run $RUN_ID for $cand"
                break
              fi
              echo "Staging run $CAND_RUN missing artifact: $ARTIFACT or $ROLES_ARTIFACT"
            done

            [ "$HIT" = true ] || echo "Promote miss: will rebuild."
          fi

          {
            echo "is_main_deploy=$IS_MAIN_DEPLOY"
            echo "hit=$HIT"
            echo "run_id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: promote-meta
    if: needs.promote-meta.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format, and typecheck
        run: pnpm run check:dashboard-expo

      - name: Test
        run: pnpm --filter dashboard-expo test

      - name: Build web
        working-directory: apps/dashboard-expo
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_CDN_URL: ${{ secrets.LBP_VITE_CDN_URL }}
          # Page host superadmin.mutiurrahman.com == this origin -> platform (super-admin) mode.
          EXPO_PUBLIC_DIRECTORY_URL: https://superadmin.mutiurrahman.com
        run: pnpm build:web

      # --clear: EXPO_PUBLIC_* are inlined at transform time, so no cached module may carry
      # another role's value.
      - name: Build role-locked web
        working-directory: apps/dashboard-expo
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_CDN_URL: ${{ secrets.LBP_VITE_CDN_URL }}
          EXPO_PUBLIC_DIRECTORY_URL: https://superadmin.mutiurrahman.com
        run: |
          set -euo pipefail
          for pair in admin:admin teacher:teacher student:student superadmin:super_admin; do
            dir="${pair%%:*}"
            EXPO_PUBLIC_APP_ROLE="${pair#*:}" pnpm exec expo export --platform web --clear \
              --output-dir "dist/roles/$dir"
          done

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: apps/dashboard-expo/dist/web
          retention-days: 14

      - name: Upload role-locked web dists
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROLES_ARTIFACT }}
          path: apps/dashboard-expo/dist/roles
          retention-days: 14

  deploy:
    needs: [promote-meta, build]
    if: |
      always() && !cancelled() &&
      needs.promote-meta.outputs.is_main_deploy == 'true' &&
      (needs.promote-meta.outputs.hit == 'true' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        site:
          - { project: school-dashboard-expo, artifact: pages-school-dashboard-expo, dir: . }
          - {
              project: school-dashboard-expo-admin,
              artifact: pages-school-dashboard-expo-roles,
              dir: admin,
            }
          - {
              project: school-dashboard-expo-teacher,
              artifact: pages-school-dashboard-expo-roles,
              dir: teacher,
            }
          - {
              project: school-dashboard-expo-student,
              artifact: pages-school-dashboard-expo-roles,
              dir: student,
            }
          - {
              project: school-dashboard-expo-superadmin,
              artifact: pages-school-dashboard-expo-roles,
              dir: superadmin,
            }
    env:
      PROJECT_NAME: ${{ matrix.site.project }}
    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.site.artifact }}
          path: dist/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.promote-meta.outputs.hit == 'true' && needs.promote-meta.outputs.run_id || github.run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Pages project if missing
        run: |
          set -euo pipefail
          # Whole cell match: school-dashboard-expo must not match school-dashboard-expo-admin.
          if npx --yes wrangler@4 pages project list | grep -Eq "(^|[│| ])${PROJECT_NAME}([│| ]|$)"; then
            echo "Pages project $PROJECT_NAME exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: >
          npx --yes wrangler@4 pages deploy dist/web/${{ matrix.site.dir }}
          --project-name=${{ env.PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
