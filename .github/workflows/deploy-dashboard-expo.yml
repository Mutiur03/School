# dashboard-expo CI + staging OTA / preview APK
#
# Every branch/PR: lint, format, typecheck, unit tests.
# staging (JS-only): OTA → staging channel on the self-hosted update server (workers/expo-updates).
# staging (native fingerprint) or dispatch build_preview: Gradle-built signed APK (run artifact).
# main: CI only. Never the production channel.

name: Deploy dashboard-expo

on:
  push:
    branches: ['**']
    paths:
      - 'apps/dashboard-expo/**'
      - 'packages/shared-schemas/**'
      - '.github/workflows/deploy-dashboard-expo.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'apps/dashboard-expo/**'
      - 'packages/shared-schemas/**'
      - '.github/workflows/deploy-dashboard-expo.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      publish_update:
        description: Publish an OTA update to the staging channel (Android)
        type: boolean
        default: false
      build_preview:
        description: Build a signed staging APK (download from the run artifacts)
        type: boolean
        default: false

concurrency:
  group: dashboard-expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native_changed: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Path list is a start, not the real native check: a lockfile-only native bump
      # or a change under packages/ can miss and OTA an APK that rejects the fingerprint.
      # Safer later: compare `npx expo-updates fingerprint:generate` to the latest
      # staging build runtime. Skip on workflow_dispatch — no commit to compare.
      - name: Detect native-fingerprint paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'apps/dashboard-expo/app.config.ts'
              - 'apps/dashboard-expo/fingerprint.config.js'
              - 'apps/dashboard-expo/package.json'
              - 'apps/dashboard-expo/assets/**'
              - 'apps/dashboard-expo/plugins/**'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format, and typecheck
        run: pnpm run check:dashboard-expo

      - name: Test
        run: pnpm --filter dashboard-expo test

  ota:
    needs: ci
    if: |
      always() && !cancelled() && needs.ci.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.publish_update) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/staging' &&
          needs.ci.outputs.native_changed != 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Self-hosted OTA (workers/expo-updates): bundle + manifest uploaded to R2 via wrangler.
      - name: Publish staging update
        working-directory: apps/dashboard-expo
        env:
          APP_ENV: staging
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_DIRECTORY_URL: https://superadmin.mutiurrahman.com
          EXPO_PUBLIC_CDN_URL: https://cdn.lbphs.gov.bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/publish-update.mjs

  preview-build:
    needs: ci
    if: |
      always() && !cancelled() && needs.ci.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.build_preview) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/staging' &&
          needs.ci.outputs.native_changed == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: staging
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_DIRECTORY_URL: https://superadmin.mutiurrahman.com
      EXPO_PUBLIC_CDN_URL: https://cdn.lbphs.gov.bd
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate android project
        working-directory: apps/dashboard-expo
        run: pnpm exec expo prebuild --platform android --clean --no-install

      # Same keystore as the staging APKs already installed, or Android refuses the upgrade.
      - name: Build signed APK
        working-directory: apps/dashboard-expo/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub secret ANDROID_STAGING_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Prebuild caps Metaspace at 512m; release lint over every native module overflows it.
          # ARM only: real phones; x86 ABIs were half the build time.
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-expo-staging-${{ github.run_number }}
          path: apps/dashboard-expo/android/app/build/outputs/apk/release/app-release.apk
