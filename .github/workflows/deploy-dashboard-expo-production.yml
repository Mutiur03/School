# dashboard-expo production — never on push.
# Run from main only. GitHub environment `production` should require a reviewer
# (Settings → Environments) so every run waits for an approval click.
# EXPO_PUBLIC_* values come from that environment's variables (vars.*), keystore from its secrets.

name: Deploy dashboard-expo (production)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a signed APK + store AAB, or publish a JS-only OTA after staging is verified
        type: choice
        options:
          - build
          - update
          - record
        default: update

concurrency:
  group: dashboard-expo-production
  cancel-in-progress: false

jobs:
  reject:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main
        run: |
          echo "::error::Production workflow only runs from main. Merge staging first, then Run workflow on main."
          exit 1

  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      APP_ENV: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_DIRECTORY_URL: ${{ vars.EXPO_PUBLIC_DIRECTORY_URL }}
      EXPO_PUBLIC_CDN_URL: ${{ vars.EXPO_PUBLIC_CDN_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format, and typecheck
        run: pnpm run check:dashboard-expo

      - name: Test
        run: pnpm --filter dashboard-expo test

      - name: Set up Java
        if: inputs.action == 'build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate android project
        if: inputs.action == 'build'
        working-directory: apps/dashboard-expo
        run: pnpm exec expo prebuild --platform android --clean --no-install

      # Upload key for Play App Signing. Losing it means a Play support reset; back it up offline.
      # APK for direct install; AAB because Google Play only accepts bundles for new apps.
      - name: Build signed APK and AAB
        if: inputs.action == 'build'
        working-directory: apps/dashboard-expo/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_PRODUCTION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub secret ANDROID_PRODUCTION_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Prebuild caps Metaspace at 512m; release lint over every native module overflows it.
          ./gradlew assembleRelease bundleRelease --no-daemon -x lintVitalAnalyzeRelease \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/dashboard-expo-production-${{ github.run_number }}.apk"

      # archive: false uploads the bare .apk (no zip); the file name becomes the artifact name.
      - name: Upload APK
        if: inputs.action == 'build'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: apps/dashboard-expo/android/app/build/outputs/apk/release/dashboard-expo-production-${{ github.run_number }}.apk

      - name: Upload AAB
        if: inputs.action == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-expo-production-${{ github.run_number }}
          path: apps/dashboard-expo/android/app/build/outputs/bundle/release/app-release.aab

      # Remember the build's runtime version so `update` can refuse an OTA no binary would accept.
      # `record` does this alone for a build that is already in users' hands.
      - name: Record production build
        if: inputs.action == 'build' || inputs.action == 'record'
        working-directory: apps/dashboard-expo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/native-guard.mjs record

      - name: Check native fingerprint
        if: inputs.action == 'update'
        working-directory: apps/dashboard-expo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/native-guard.mjs check

      - name: Publish production update
        if: inputs.action == 'update'
        working-directory: apps/dashboard-expo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/publish-update.mjs
