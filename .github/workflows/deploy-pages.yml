# Deploy Frontend (Cloudflare Pages)
#
# Promote flow: staging builds all dashboard apps and uploads dist artifacts.
# main looks up a successful staging run for github.sha (and merge 2nd parent) —
# on hit, download dists and wrangler deploy only; on miss, rebuild.

name: Deploy Frontend

on:
  push:
    branches: ['main', 'staging']
    paths:
      - 'dashboard/**'
      - 'packages/**'
      - 'turbo.json'
      - '.github/workflows/deploy-pages.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'packages/**'
      - 'turbo.json'
      - '.github/workflows/deploy-pages.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-meta:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      is_main_deploy: ${{ steps.meta.outputs.is_main_deploy }}
      hit: ${{ steps.meta.outputs.hit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - name: Resolve promote metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IS_MAIN_DEPLOY=false
          HIT=false
          RUN_ID=

          if [ '${{ github.ref }}' = 'refs/heads/main' ] && \
             { [ '${{ github.event_name }}' = 'push' ] || [ '${{ github.event_name }}' = 'workflow_dispatch' ]; }; then
            IS_MAIN_DEPLOY=true

            CANDIDATES=("$GITHUB_SHA")
            while IFS= read -r parent; do
              [ -n "$parent" ] && CANDIDATES+=("$parent")
            done < <(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}" \
              --jq '.parents[1:][].sha // empty')

            for cand in "${CANDIDATES[@]}"; do
              CAND_RUN="$(gh run list \
                --repo '${{ github.repository }}' \
                --branch staging \
                --commit "$cand" \
                --workflow 'Deploy Frontend' \
                --status success \
                --limit 20 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$cand\")][0].databaseId // empty")"
              if [ -z "$CAND_RUN" ]; then
                echo "No staging Deploy Frontend run for $cand"
                continue
              fi
              NAMES="$(gh api \
                "repos/${{ github.repository }}/actions/runs/${CAND_RUN}/artifacts" \
                --jq '[.artifacts[].name] | join(" ")')"
              MISSING=false
              for required in pages-lbp-dashboard pages-lbp-admin pages-lbp-teacher pages-lbp-student pages-school-superadmin; do
                if ! echo " $NAMES " | grep -q " $required "; then
                  echo "Staging run $CAND_RUN missing artifact: $required"
                  MISSING=true
                fi
              done
              if [ "$MISSING" = false ]; then
                HIT=true
                RUN_ID="$CAND_RUN"
                echo "Promote hit: staging run $RUN_ID for $cand"
                break
              fi
            done

            if [ "$HIT" != true ]; then
              echo "Promote miss: no complete staging Deploy Frontend artifacts — will rebuild."
            fi
          fi

          {
            echo "is_main_deploy=$IS_MAIN_DEPLOY"
            echo "hit=$HIT"
            echo "run_id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

  build-shared:
    needs: promote-meta
    if: needs.promote-meta.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint, format, and typecheck
        run: pnpm run check:dashboard

      - name: Build shared packages
        if: github.event_name != 'pull_request'
        run: pnpm exec turbo run build --filter=@school/shared-schemas --filter=@school/common-ui

      - name: Upload shared package builds
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shared-packages-dist
          path: |
            packages/shared-schemas/dist
            packages/common-ui/dist
          retention-days: 1

  deploy-pages:
    needs: [promote-meta, build-shared]
    if: |
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.promote-meta.outputs.hit == 'true' || needs.build-shared.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: LBP Dashboard
            directory: dashboard
            workspace: dashboard
            build_script: build
            project_name: lbp-dashboard
            env_file: .env.production.local
          - name: LBP Admin
            directory: dashboard
            workspace: dashboard
            build_script: build:admin
            project_name: lbp-admin
            env_file: .env.admin.local
            default_role: admin
          - name: LBP Teacher
            directory: dashboard
            workspace: dashboard
            build_script: build:teacher
            project_name: lbp-teacher
            env_file: .env.teacher.local
            default_role: teacher
          - name: LBP Student
            directory: dashboard
            workspace: dashboard
            build_script: build:student
            project_name: lbp-student
            env_file: .env.student.local
            default_role: student
          - name: Super admin
            directory: dashboard
            workspace: dashboard
            build_script: build:super_admin
            project_name: school-superadmin
            env_file: .env.super_admin.local
            default_role: super_admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download promoted dist for ${{ matrix.app.name }}
        if: needs.promote-meta.outputs.hit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pages-${{ matrix.app.project_name }}
          path: ./${{ matrix.app.directory }}/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.promote-meta.outputs.run_id }}

      - name: Install pnpm
        if: needs.promote-meta.outputs.hit != 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: needs.promote-meta.outputs.hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        if: needs.promote-meta.outputs.hit != 'true'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Turborepo
        if: needs.promote-meta.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Download shared package builds
        if: needs.promote-meta.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: shared-packages-dist
          path: packages

      - name: Validate Sentry DSN secret
        if: needs.promote-meta.outputs.hit != 'true'
        run: |
          if [ -z "${{ secrets.VITE_SENTRY_DSN }}" ]; then
            echo "::error::GitHub secret VITE_SENTRY_DSN is empty. Frontend Sentry will not send events."
            exit 1
          fi

      - name: Write production env for ${{ matrix.app.name }}
        if: needs.promote-meta.outputs.hit != 'true'
        run: |
          {
            echo "VITE_CDN_URL=${{ secrets.LBP_VITE_CDN_URL }}"
            echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}"
            if [ -n "${{ matrix.app.default_role }}" ]; then
              echo "VITE_DEFAULT_ROLE=${{ matrix.app.default_role }}"
            fi
          } > ./${{ matrix.app.directory }}/${{ matrix.app.env_file }}

      - name: Build ${{ matrix.app.name }}
        if: needs.promote-meta.outputs.hit != 'true'
        run: pnpm exec turbo run ${{ matrix.app.build_script }} --filter=dashboard

      - name: Upload dist artifact for ${{ matrix.app.name }}
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ matrix.app.project_name }}
          path: ./${{ matrix.app.directory }}/dist
          retention-days: 14
          if-no-files-found: error

      - name: Set up Node.js for promote deploy
        if: |
          needs.promote-meta.outputs.is_main_deploy == 'true' &&
          needs.promote-meta.outputs.hit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy ${{ matrix.app.name }}
        if: needs.promote-meta.outputs.is_main_deploy == 'true'
        run: |
          if [ '${{ needs.promote-meta.outputs.hit }}' = 'true' ]; then
            npx --yes wrangler@4 pages deploy ./${{ matrix.app.directory }}/dist --project-name=${{ matrix.app.project_name }}
          else
            pnpm exec wrangler pages deploy ./${{ matrix.app.directory }}/dist --project-name=${{ matrix.app.project_name }}
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # After every Pages app is live, wipe Cloudflare edge caches so custom
  # domains don't keep an old index.html / HTML shell.
  #
  # Dynamic zone handling (pick one):
  # - CF_PURGE_ZONE_NAMES: comma-separated zone names, e.g.
  #     mutiurrahman.com,lbphs.gov.bd
  #   Add a new custom domain later by appending to this secret.
  # - Or leave CF_PURGE_ZONE_NAMES empty → purge every zone this API token
  #   can list (scope the token to only school-related zones).
  # - CF_PURGE_ZONE_IDS still works as an explicit override if set.
  purge-cdn:
    name: Purge Cloudflare CDN
    needs: [promote-meta, deploy-pages]
    if: |
      always() && !cancelled() &&
      needs.promote-meta.outputs.is_main_deploy == 'true' &&
      needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare zones
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PURGE_ZONE_NAMES: ${{ secrets.CF_PURGE_ZONE_NAMES }}
          CF_PURGE_ZONE_IDS: ${{ secrets.CF_PURGE_ZONE_IDS }}
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::warning::Skipping CDN purge — CF_API_TOKEN is not set."
            exit 0
          fi

          auth_header="Authorization: Bearer ${CF_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4"

          declare -a ZONE_IDS=()

          if [ -n "${CF_PURGE_ZONE_IDS:-}" ]; then
            IFS=',' read -ra RAW_IDS <<< "$CF_PURGE_ZONE_IDS"
            for id in "${RAW_IDS[@]}"; do
              id="$(echo "$id" | xargs)"
              [ -n "$id" ] && ZONE_IDS+=("$id")
            done
            echo "Using explicit CF_PURGE_ZONE_IDS (${#ZONE_IDS[@]} zone(s))."
          else
            # Page through every zone visible to this token.
            page=1
            declare -a ALL_ZONES=()
            while :; do
              payload="$(curl -sS -H "$auth_header" \
                "${api}/zones?per_page=50&page=${page}")"
              echo "$payload" | grep -q '"success":true' || {
                echo "::error::Failed to list Cloudflare zones."
                echo "$payload"
                exit 1
              }
              # id|name pairs
              while IFS= read -r line; do
                [ -n "$line" ] && ALL_ZONES+=("$line")
              done < <(echo "$payload" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for z in data.get("data") or data.get("result") or []:
              print(f"{z["id"]}|{z["name"]}")
          ')
              total_pages="$(echo "$payload" | python3 -c '
          import json,sys
          r=json.load(sys.stdin).get("result_info") or {}
          print(r.get("total_pages") or 1)
          ')"
              if [ "$page" -ge "$total_pages" ]; then
                break
              fi
              page=$((page + 1))
            done

            if [ -n "${CF_PURGE_ZONE_NAMES:-}" ]; then
              IFS=',' read -ra WANTED <<< "$CF_PURGE_ZONE_NAMES"
              declare -A WANT_SET=()
              for name in "${WANTED[@]}"; do
                name="$(echo "$name" | xargs | tr '[:upper:]' '[:lower:]')"
                [ -n "$name" ] && WANT_SET["$name"]=1
              done
              for entry in "${ALL_ZONES[@]}"; do
                id="${entry%%|*}"
                name="$(echo "${entry#*|}" | tr '[:upper:]' '[:lower:]')"
                if [ -n "${WANT_SET[$name]:-}" ]; then
                  ZONE_IDS+=("$id")
                  echo "Matched zone name: $name → $id"
                fi
              done
              if [ "${#ZONE_IDS[@]}" -eq 0 ]; then
                echo "::error::CF_PURGE_ZONE_NAMES set, but no matching zones found for this token."
                echo "Visible zones:"
                printf '  %s\n' "${ALL_ZONES[@]#*|}"
                exit 1
              fi
            else
              for entry in "${ALL_ZONES[@]}"; do
                ZONE_IDS+=("${entry%%|*}")
                echo "Will purge zone: ${entry#*|}"
              done
              echo "CF_PURGE_ZONE_NAMES unset — purging all ${#ZONE_IDS[@]} zone(s) visible to the token."
            fi
          fi

          if [ "${#ZONE_IDS[@]}" -eq 0 ]; then
            echo "::warning::No Cloudflare zones to purge."
            exit 0
          fi

          failed=0
          for zone in "${ZONE_IDS[@]}"; do
            echo "Purging zone ${zone}…"
            response="$(curl -sS -X POST \
              "${api}/zones/${zone}/purge_cache" \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')"
            echo "$response"
            echo "$response" | grep -q '"success":true' || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Cloudflare purge requests failed."
            exit 1
          fi
