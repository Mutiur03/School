name: Deploy Auth BFF Worker

on:
  push:
    branches: ['main']
    paths:
      - 'workers/auth-bff/**'
      - '.github/workflows/deploy-auth-bff.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'workers/auth-bff/**'
      - '.github/workflows/deploy-auth-bff.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: auth-bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format, and typecheck
        run: pnpm run check:auth-bff

      - name: Deploy worker
        if: github.event_name != 'pull_request'
        working-directory: workers/auth-bff
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
