name: Deploy School Client (Cloudflare)

on:
  push:
    branches: ["main"]
    paths:
      - "client-next/**"
      - "packages/common-ui/**"
      - "packages/shared-schemas/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "vercel.json"
      - ".github/workflows/deploy-client-next-cf.yml"
  workflow_dispatch:

concurrency:
  group: school-client-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # OpenNext bundling is reliable on Linux; Node 22 matches local tooling.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-client-cf-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-client-cf-

      # Reuse Next.js's incremental (webpack) compiler cache across deploys so
      # unchanged modules aren't recompiled. Keyed on the lockfile + client-next
      # sources; falls back to the newest partial cache via restore-keys.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: client-next/.next/cache
          key: nextjs-cf-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('client-next/app/**', 'client-next/components/**', 'client-next/hooks/**', 'client-next/lib/**', 'client-next/queries/**', 'client-next/types/**', 'client-next/next.config.ts') }}
          restore-keys: |
            nextjs-cf-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-cf-

      - name: Write client-next build env
        working-directory: client-next
        env:
          BACKEND_URL: ${{ secrets.CLIENT_NEXT_BACKEND_URL || secrets.LBP_VITE_BACKEND_URL }}
          CDN_URL: ${{ secrets.CLIENT_NEXT_CDN_URL || secrets.LBP_VITE_CDN_URL }}
          DEFAULT_TENANT_HOST: ${{ secrets.CLIENT_NEXT_DEFAULT_TENANT_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::Set GitHub secret CLIENT_NEXT_BACKEND_URL (or LBP_VITE_BACKEND_URL)."
            exit 1
          fi
          {
            echo "API_URL=${BACKEND_URL}"
            echo "BACKEND_URL=${BACKEND_URL}"
            echo "NEXT_PUBLIC_BACKEND_URL=${BACKEND_URL}"
            if [ -n "${CDN_URL:-}" ]; then
              echo "NEXT_PUBLIC_CDN_URL=${CDN_URL}"
            fi
            if [ -n "${DEFAULT_TENANT_HOST:-}" ]; then
              echo "NEXT_PUBLIC_DEFAULT_TENANT_HOST=${DEFAULT_TENANT_HOST}"
            fi
            echo "OPEN_NEXT=1"
            echo "WRANGLER_BUILD_CONDITIONS="
            echo "WRANGLER_BUILD_PLATFORM=node"
          } > .env.production
          echo "Wrote client-next/.env.production (values redacted)."

      - name: Build OpenNext bundle
        run: pnpm run build:client:cf
        env:
          OPEN_NEXT: "1"
          # Also expose for Next config / tooling that reads process.env in CI.
          API_URL: ${{ secrets.CLIENT_NEXT_BACKEND_URL || secrets.LBP_VITE_BACKEND_URL }}
          BACKEND_URL: ${{ secrets.CLIENT_NEXT_BACKEND_URL || secrets.LBP_VITE_BACKEND_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.CLIENT_NEXT_BACKEND_URL || secrets.LBP_VITE_BACKEND_URL }}
          NEXT_PUBLIC_CDN_URL: ${{ secrets.CLIENT_NEXT_CDN_URL || secrets.LBP_VITE_CDN_URL }}
          NEXT_PUBLIC_DEFAULT_TENANT_HOST: ${{ secrets.CLIENT_NEXT_DEFAULT_TENANT_HOST }}

      - name: Deploy Worker school-client
        working-directory: client-next
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPEN_NEXT: "1"
