# Deploy School Client (Cloudflare / OpenNext)
#
# Promote flow: staging runs check + OpenNext build and uploads client-next/.open-next.
# main looks up a successful staging run for github.sha (and merge 2nd parent) —
# on hit, download .open-next and run opennextjs-cloudflare deploy only; on miss, rebuild.

name: Deploy School Client (Cloudflare)

on:
  push:
    branches: ['main', 'staging']
    paths:
      - 'client-next/**'
      - 'packages/common-ui/**'
      - 'packages/shared-schemas/**'
      - 'turbo.json'
      - 'vercel.json'
      - '.github/workflows/deploy-client-next-cf.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'client-next/**'
      - 'packages/common-ui/**'
      - 'packages/shared-schemas/**'
      - 'turbo.json'
      - 'vercel.json'
      - '.github/workflows/deploy-client-next-cf.yml'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.prettierignore'
      - 'scripts/ci-check.mjs'
      - 'scripts/run-eslint.mjs'
      - 'scripts/eslint-ts6-preload.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: school-client-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-meta:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      is_main_deploy: ${{ steps.meta.outputs.is_main_deploy }}
      hit: ${{ steps.meta.outputs.hit }}
      run_id: ${{ steps.meta.outputs.run_id }}
    steps:
      - name: Resolve promote metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IS_MAIN_DEPLOY=false
          HIT=false
          RUN_ID=

          if [ '${{ github.ref }}' = 'refs/heads/main' ] && \
             { [ '${{ github.event_name }}' = 'push' ] || [ '${{ github.event_name }}' = 'workflow_dispatch' ]; }; then
            IS_MAIN_DEPLOY=true

            CANDIDATES=("$GITHUB_SHA")
            while IFS= read -r parent; do
              [ -n "$parent" ] && CANDIDATES+=("$parent")
            done < <(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}" \
              --jq '.parents[1:][].sha // empty')

            for cand in "${CANDIDATES[@]}"; do
              CAND_RUN="$(gh run list \
                --repo '${{ github.repository }}' \
                --branch staging \
                --commit "$cand" \
                --workflow 'Deploy School Client (Cloudflare)' \
                --status success \
                --limit 20 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$cand\")][0].databaseId // empty")"
              if [ -z "$CAND_RUN" ]; then
                echo "No staging client-next run for $cand"
                continue
              fi
              HAS_ARTIFACT="$(gh api \
                "repos/${{ github.repository }}/actions/runs/${CAND_RUN}/artifacts" \
                --jq '[.artifacts[].name] | index("client-next-cf") != null')"
              if [ "$HAS_ARTIFACT" = 'true' ]; then
                HIT=true
                RUN_ID="$CAND_RUN"
                echo "Promote hit: staging run $RUN_ID for $cand"
                break
              fi
              echo "Staging run $CAND_RUN missing client-next-cf artifact"
            done

            if [ "$HIT" != true ]; then
              echo "Promote miss: no staging OpenNext artifact — will rebuild."
            fi
          fi

          {
            echo "is_main_deploy=$IS_MAIN_DEPLOY"
            echo "hit=$HIT"
            echo "run_id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: promote-meta
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download promoted OpenNext bundle
        if: needs.promote-meta.outputs.hit == 'true'
        uses: actions/download-artifact@v5
        with:
          name: client-next-cf
          path: client-next/.open-next
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.promote-meta.outputs.run_id }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # OpenNext bundling is reliable on Linux; Node 22 matches local tooling.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        if: needs.promote-meta.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Reuse Next.js's incremental (webpack) compiler cache across deploys so
      # unchanged modules aren't recompiled. Keyed on the lockfile + client-next
      # sources; falls back to the newest partial cache via restore-keys.
      - name: Cache Next.js build cache
        if: needs.promote-meta.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: client-next/.next/cache
          key: nextjs-cf-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('client-next/app/**', 'client-next/components/**', 'client-next/hooks/**', 'client-next/lib/**', 'client-next/queries/**', 'client-next/types/**', 'client-next/next.config.ts') }}
          restore-keys: |
            nextjs-cf-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-cf-

      - name: Lint, format, and typecheck
        if: needs.promote-meta.outputs.hit != 'true'
        run: pnpm run check:client-next

      - name: Write client-next build env
        if: github.event_name != 'pull_request' && needs.promote-meta.outputs.hit != 'true'
        working-directory: client-next
        env:
          CDN_URL: ${{ secrets.CLIENT_NEXT_CDN_URL || secrets.LBP_VITE_CDN_URL }}
        run: |
          set -euo pipefail
          {
            if [ -n "${CDN_URL:-}" ]; then
              echo "NEXT_PUBLIC_CDN_URL=${CDN_URL}"
            fi
            echo "OPEN_NEXT=1"
            echo "WRANGLER_BUILD_CONDITIONS="
            echo "WRANGLER_BUILD_PLATFORM=node"
          } > .env.production
          echo "Wrote client-next/.env.production (values redacted)."

      - name: Build OpenNext bundle
        if: github.event_name != 'pull_request' && needs.promote-meta.outputs.hit != 'true'
        # Bypass stale turbo cache so .open-next is always produced for promote artifacts.
        run: pnpm exec turbo run build:cf --filter=client-next --force
        env:
          OPEN_NEXT: '1'
          NEXT_PUBLIC_CDN_URL: ${{ secrets.CLIENT_NEXT_CDN_URL || secrets.LBP_VITE_CDN_URL }}

      - name: Verify OpenNext output
        if: |
          github.ref == 'refs/heads/staging' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          if [ ! -f client-next/.open-next/worker.js ]; then
            echo "::error::Expected client-next/.open-next/worker.js after build:cf — open-next output missing."
            ls -la client-next || true
            ls -la client-next/.open-next || true
            exit 1
          fi
          echo "OpenNext bundle OK:"
          du -sh client-next/.open-next
          ls client-next/.open-next | head -n 20

      - name: Upload OpenNext artifact
        if: |
          github.ref == 'refs/heads/staging' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v5
        with:
          name: client-next-cf
          path: client-next/.open-next
          retention-days: 14
          if-no-files-found: error
          # Required: .open-next is a hidden directory (dot-prefixed).
          include-hidden-files: true

      - name: Deploy Worker school-client
        if: needs.promote-meta.outputs.is_main_deploy == 'true'
        working-directory: client-next
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPEN_NEXT: '1'
